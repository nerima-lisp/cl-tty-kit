name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on purpose. Granularity belongs in the flake's `checks.*`
  # attributes, which `nix flake check` evaluates in parallel with build
  # caching. Splitting these into separate GitHub jobs would duplicate that
  # scheduling and lose cache sharing between them.
  #
  # Add a second job ONLY for work the Nix sandbox cannot do: network access,
  # a real PTY/TTY, or artifact upload. `coverage` and `contrib` below are this
  # repository's two such cases. "A different runner OS" is no longer one of
  # them: as of the 2026-08-01 revision flake.nix declares x86_64-linux alone,
  # so a macOS runner would have no output to check. The two-leg matrix that
  # used to carry an aarch64-darwin/macos-latest entry is deleted rather than
  # left at one element — a one-element matrix signals an intent to add more,
  # and there is none. See PACKAGE_STANDARD.md "CI の粒度".
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Runs the SBCL test suite (checks.default), the treefmt formatting gate
      # (checks.formatting), the structural paredit lint (checks.paredit-lint)
      # and the mkdocs --strict build (checks.docs).
      #
      # No --all-systems. `systems` is a single element, so it would not widen
      # the check; and it does not merely evaluate a foreign system, it realises
      # its derivations, which is how the old darwin leg failed with "platform
      # mismatch". See PACKAGE_STANDARD.md "systems".
      - name: Check flake
        run: nix flake check --print-build-logs

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check

  # Separate job because the Nix sandbox cannot publish artifacts. The report
  # itself is built hermetically by `nix build .#coverage-report`; only the
  # upload has to happen outside.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Generate coverage report
        run: |
          set -euo pipefail
          nix build .#coverage-report --print-build-logs
          cp -rL result coverage-report

      - name: Upload coverage report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: error

  # Separate job because it needs the network *inside* the build: contrib/
  # pulls Quicklisp (for clweb) on top of cl-prolog/cl-weave from this flake's
  # inputs, and the Nix sandbox has none.
  #
  # continue-on-error because contrib is opt-in and isolated from the core
  # build (see contrib/README.md), so Quicklisp/network flakiness must never
  # block a core merge. This is the only job here allowed to be best-effort;
  # do not use it to silence a test that is supposed to fail.
  contrib:
    name: contrib (opt-in, best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install Quicklisp
        run: |
          set -euo pipefail
          nix develop --command bash -c '
            curl -fsSL -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval "(quicklisp-quickstart:install)"
          '

      # `nix develop` puts cl-prolog/cl-weave from this flake's inputs on
      # CL_SOURCE_REGISTRY (see flake.nix devShells.default.shellHook).
      - name: Run contrib verification
        run: nix develop --command sbcl --script contrib/verify-contrib.lisp
