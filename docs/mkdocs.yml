# cl-tty-kit documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml

site_name: cl-tty-kit
site_description: >-
  A small, low-dependency Common Lisp terminal toolkit — raw mode, ANSI
  helpers, input/mouse decoding, Unicode-aware layout, a screen/diff renderer,
  and PTY support for SBCL.
site_author: cl-tty-kit contributors
site_url: https://nerima-lisp.github.io/cl-tty-kit/

repo_name: nerima-lisp/cl-tty-kit
repo_url: https://github.com/nerima-lisp/cl-tty-kit
edit_uri: edit/main/docs/src/

# Content lives in docs/src.
docs_dir: src
site_dir: ../site
use_directory_urls: true

# Also passed as --strict by flake.nix's `packages.docs`. Declaring it here too
# means `mkdocs serve` applies the same rule, so there is no invocation path
# that silently tolerates a broken link. Use `mkdocs serve --no-strict` while
# drafting if you want warnings not to stop the build.
strict: true

copyright: Copyright &copy; cl-tty-kit contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/console-line
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-tty-kit
      name: cl-tty-kit on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. install paths, SBCL/macOS/Linux variants).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols, emoji.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

# Six fixed sections, in this order, per the org DOCS_STANDARD. The order
# tracks the reader's state: Getting Started is for someone who has not run it
# yet, Guide for someone who has but does not know the design, Reference for
# someone writing code and looking up one answer, Internals for someone
# changing the library, Project for someone contributing to it. Readers drop
# off along that path, so reference and internals sit at the back.
nav:
  - Home: README.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
  - Guide:
      - Screen and Rendering: screen-and-rendering.md
      - Layout and Rects: layout.md
      - Widgets: widgets.md
      - Input Decoding: input-decoding.md
      - Mouse Input: mouse-input.md
      - ANSI Helpers: ansi-helpers.md
      - Color: color.md
      - Text Layout and Unicode Width: text-layout.md
      - Terminal Session and Raw Mode: terminal-session.md
      - PTY: pty.md
      - Logic Engine (Prolog): logic-engine.md
      - Examples: examples.md
      - Optional Integrations: contrib.md
  - Reference:
      - API Reference: api-reference.md
      - Conditions: conditions.md
      - Compatibility: compatibility.md
  - Internals:
      - Architecture: architecture.md
      - Feature Audit: feature-audit.md
  - Project:
      - Development: development.md
      - Quality Gates: quality-gates.md
      - Release Process: release-process.md
      - Roadmap: roadmap.md

# docs/notes/ is for measurements worth keeping but not worth publishing.
# --strict fails on any page missing from the nav, so without this declaration
# adding such a file would break the build.
not_in_nav: |
  notes/
